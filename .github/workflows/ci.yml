name: CI QSDK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04  # 修改1：升级系统以获得高优先级
    steps:
      - name: Free disk space
        run: |
          # QSDK 编译非常占空间，清理动作必须彻底
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Install dependencies
        run: |
          sudo apt update
          # Ubuntu 22.04 源里包含 coccinelle，无需 PPA
          # 安装 QSDK 所需的依赖，包括 python3-distutils
          sudo apt install -y build-essential clang flex g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            coccinelle file wget

      - name: Checkout
        uses: actions/checkout@v4 # 修改2：升级到 v4

      - name: Hook the openwrt_core URL for opkg
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          # 优化时间获取逻辑，增加 fallback
          TIME="$(curl -s "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | jq -r .created_at)"
          if [ -z "$TIME" ] || [ "$TIME" == "null" ]; then TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ"); fi

          echo "ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA:0:8}" >version
          sed -i "s|%U/targets/%S/packages|https://${OWNER}.github.io/${REPO}/${GITHUB_REF_NAME}/%R|" include/feeds.mk

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 这里保留了你原本的所有 QSDK 和 NSS 驱动配置
      - name: Configure
        run: |
          cat <<EOF | sed -E 's/^  //' >.config
            CONFIG_TARGET_ipq50xx=y
            CONFIG_TARGET_ipq50xx_arm=y
            CONFIG_TARGET_MULTI_PROFILE=y
            CONFIG_TARGET_ALL_PROFILES=y
            CONFIG_TARGET_PER_DEVICE_ROOTFS=y

            CONFIG_ATH11K_MEM_PROFILE_256M=y

            CONFIG_IB=y
            CONFIG_SDK=y
            CONFIG_MAKE_TOOLCHAIN=y

            CONFIG_ALL_NONSHARED=y
            CONFIG_REPRODUCIBLE_DEBUG_INFO=y

            CONFIG_PACKAGE_kmod-bonding=y
            CONFIG_PACKAGE_kmod-qca-nss-ecm-standard=y
            CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe=y

            CONFIG_PACKAGE_luci=y
          EOF
          make defconfig

      - name: Download
        run: |
          make -j8 download

      - name: Build tools
        run: |
          make -j$(nproc) tools/install

      - name: Build toolchain
        run: |
          make -j$(nproc) toolchain/install

      - name: Build all
        run: |
          make -j$(nproc) IGNORE_ERRORS=1

      - name: Upload bin to artifacts
        uses: actions/upload-artifact@v4 # 修改3：升级到 v4
        with:
          name: bin-ipq50xx-arm
          path: bin/targets/ipq50xx/arm/*

      - name: Upload dl to artifacts
        uses: actions/upload-artifact@v4 # 修改4：升级到 v4
        with:
          name: dl
          path: dl/*

  release:
    needs: [ build ]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dl from artifacts
        uses: actions