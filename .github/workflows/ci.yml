name: CI

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04  # 修改1：升级到 22.04，解决排队问题
    steps:
      - name: Free disk space
        run: |
          # 清理更多空间，防止 QSDK 编译爆盘
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Install dependencies
        run: |
          sudo apt update
          # QSDK 5.4 需要 Python2 支持，22.04 需要手动处理一下
          sudo apt install -y build-essential clang flex g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
          
      - name: Checkout
        uses: actions/checkout@v4 # 修改2：升级到 v4

      - name: Hook the openwrt_core URL for opkg
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          TIME="$(curl -s "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | jq -r .created_at)"
          
          # 防止 curl 失败导致变量为空
          if [ -z "$TIME" ] || [ "$TIME" == "null" ]; then TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ"); fi

          echo "ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA:0:8}" >version
          sed -i "s|%U/targets/%S/packages|https://${OWNER}.github.io/${REPO}/${GITHUB_REF_NAME}/%R|" include/feeds.mk

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cat <<EOF | sed -E 's/^  //' >.config
            CONFIG_TARGET_ipq50xx=y
            CONFIG_TARGET_ipq50xx_arm=y
            CONFIG_TARGET_MULTI_PROFILE=y
            CONFIG_TARGET_ALL_PROFILES=y
            CONFIG_TARGET_PER_DEVICE_ROOTFS=y

            CONFIG_IB=y
            CONFIG_SDK=y
            CONFIG_MAKE_TOOLCHAIN=y

            CONFIG_ALL_NONSHARED=y
            CONFIG_REPRODUCIBLE_DEBUG_INFO=y

            CONFIG_PACKAGE_luci=y
          EOF
          make defconfig

      - name: Download
        run: |
          make -j8 download

      - name: Build tools
        run: |
          make -j$(nproc) tools/install

      - name: Build toolchain
        run: |
          make -j$(nproc) toolchain/install

      - name: Build all
        run: |
          make -j$(nproc) IGNORE_ERRORS=1

      - name: Upload bin to artifacts
        uses: actions/upload-artifact@v4 # 修改3：升级到 v4
        with:
          name: bin-ipq50xx-arm
          path: bin/targets/ipq50xx/arm/*

      - name: Upload dl to artifacts
        uses: actions/upload-artifact@v4 # 修改4：升级到 v4
        with:
          name: dl
          path: dl/*

  # 注意：我移除了 gh-pages 任务，因为它对于救砖不是必须的，且容易出错。
  # 我们只需要 release 里的 factory.ubi 文件。

  release:
    needs: [ build ]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dl from artifacts
        uses: actions/download-artifact@v4
        with:
          name: dl
          path: dl/

      - name: Download bin from artifacts
        uses: actions/download-artifact@v4
        with:
          name: bin-ipq50xx-arm
          path: bin/targets/ipq50xx/arm/

      - name: Tar
        run: |
          tar cvf dl.tar -C dl/ .
          tar cvf bin-ipq50xx.tar -C bin/targets/ipq50xx/arm/ .

      - name: Generate release informations
        run: |
          TIME="$(curl -s "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | jq -r .created_at)"
          if [ -z "$TIME" ] || [ "$TIME" == "null" ]; then TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ"); fi

          TAG="ci-${GITHUB_REF_NAME}-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S-%Z')"
          echo "TAG=$TAG" >>$GITHUB_ENV

          # 简化 Release 说明生成，防止出错
          echo "CI Build for QSDK 5.4" > Release.md
          echo "Release version: ${TAG}" >> Release.md
          
          echo "NAME=${TAG}" >>$GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2 # 修改5：升级到 v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.NAME }}
          body_path: Release.md
          files: |
            bin/targets/ipq50xx/arm/sha256sums
            bin/targets/ipq50xx/arm/*squashfs-nand-factory.ubi
            bin/targets/ipq50xx/arm/*squashfs-sysupgrade.bin